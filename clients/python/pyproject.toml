[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "surfaceapi"
version = "0.1.1"
description = "Check a short link before your agent opens it. Surface client: unwrap t.co/bit.ly/lnkd.in/youtu.be and get fetch or skip. 1M requests/month free."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Surface / Canada Site Ops", email = "canada.site.ops@gmail.com"}]
keywords = ["surface", "short-link", "unwrap", "link-check", "preflight", "mcp", "agents"]
[project.urls]
Homepage = "https://nova-otter-delta-cloud.grok.me"
Source = "https://github.com/Surface-ops/surface"
